name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-scenario-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'

  suite-evaluation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - datasets/suites/p0-evolution-suite.json
          - datasets/suites/p0-evolution-suite-2.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Run frozen P0 evolution suite
        run: python -m veritas.evaluation.suite_runner --manifest ${{ matrix.manifest }} --artifacts-root artifacts
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'

  extraction-calibration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: M1-2C2
            dataset: datasets/extraction/httpx-m1-2c
            summary: artifacts/extraction/httpx-initial-extraction-3.0.0/summary.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Run frozen extraction calibration (${{ matrix.name }})
        run: >-
          python -m veritas.evaluation.extraction_runner
          --benchmark ${{ matrix.dataset }}/benchmark.json
          --fixtures ${{ matrix.dataset }}/fixtures.json
          --corpus-root datasets/corpus/httpx-docs
          --output ${{ matrix.summary }}
          --assert-pass
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Verify committed calibration artifact is reproducible
        run: git diff --exit-code -- ${{ matrix.summary }}

  evolution-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Run scaled evolution benchmark over real corpus history
        run: >-
          python -m veritas.evaluation.evolution_benchmark
          --corpus-root datasets/corpus/httpx-docs
          --output artifacts/evolution/m1-5b-benchmark/summary.json
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Verify committed benchmark artifact is reproducible
        run: git diff --exit-code -- artifacts/evolution/m1-5b-benchmark/summary.json
