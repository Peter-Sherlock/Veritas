name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-scenario-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'

  suite-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Run frozen P0 evolution suite
        run: python -m veritas.evaluation.suite_runner --manifest datasets/suites/p0-evolution-suite.json --artifacts-root artifacts
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
